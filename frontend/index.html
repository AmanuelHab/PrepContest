<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>PrepContest for Competitive Programmers</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            background-color: antiquewhite;
        }
        main{
            max-width: 1000px;
        }
        h1{
            margin: 20px;
            border-bottom: 2px solid black;
            border-radius: 2px;
            display: inline-block;
        }
        .input-handler {
            background-color: #fff;
            border: 2px solid black;
            border-radius: 20px;
            margin: auto 20px ;
            padding: 10px;
        }
        form{
            display: block;
        }
        label{
            display: block;
        }
        .inline-control{
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
        }
        input{
            min-height: 45px;
            padding: 10px 12px;
            height: auto;
            width: 100%;
            border-radius: 6px;
        }
        button{
            background-color: #9e9;
            width: 30%;
            min-height: 45px;
        }
        .handle-board{
            display: flex;
            flex-wrap: wrap;
            gap: 10%;
            border: 1px solid black;
        }
        .handles{
            width: 15%;
            border: 1pt solid black;
            border-radius: 10%;
            padding: 5px 0;
            margin: 1%;
            text-align: center;
        }
        .hidden{
            display: none;
        }
    </style>
</head>
<body>
    <h1>PrepContest</h1>
    <main>
        <div class="input-handler">
            <form id="handle-form">
                <label for="handle-input">Handle</label>
                <div class="inline-control">
                    <input type="text" id="handle-input" placeholder="tourist...">
                    <button type="button" id="add-button">Add</button>
                </div>
            </form>
            <div class="handle-board" id="handles" aria-live="polite"></div>
            
            <div class="field-grid">
                <label>
                    Min rating
                    <input type="number" id="min-rating" min="800" max="3600" step="100" value="800">
                </label>
                <label>
                    Max rating
                    <input type="number" id="max-rating" min="800" max="3600" step="100" value="2000">
                </label>
                <label>
                    Number of Problems
                    <input type="number" id="problem-count" min="1" max="30" step="1" value="7">
                </label>
            </div>
        </div>
        <div id="error" class="notice error hidden"></div>
        <div id="loading" class="notice loading hidden">Loading...</div>

        <div class="action-row">
            <button type="button" id="generate-button">Generate</button>
        </div>

        <div id="problems" class=""></div>


    </main>
    <script src="main.js"> </script>
</body>
</html>
